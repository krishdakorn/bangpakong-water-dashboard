<!DOCTYPE html>
<html lang="th">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>กราฟระดับน้ำสถานีบางปะกง - คลังข้อมูลน้ำ (Realtime)</title>
		<script src="https://code.highcharts.com/highcharts.js"></script>
		<script src="https://cdn.tailwindcss.com"></script>
		<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
		<style>
			body { font-family: 'Prompt', sans-serif; background-color: #0b1329; color: #e2e8f0; }
			.dark-card { background-color: #111c38; border: 1px solid #1e293b; }
		</style>
	</head>
	<body class="p-4 md:p-6">
	<div class="max-w-7xl mx-auto space-y-6">

		<div class="dark-card p-4 rounded-xl shadow-lg flex flex-wrap items-center justify-between gap-4">
			<h1 class="text-xl font-semibold text-cyan-400">📊 กราฟระดับน้ำ (สถานีบางปะกง จ.ฉะเชิงเทรา)</h1>
			<button id="refresh" class="bg-cyan-600 hover:bg-cyan-500 text-white px-5 py-1.5 rounded font-medium transition">รีเฟรชข้อมูล</button>
		</div>

		<div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
			<div class="dark-card p-4 rounded-xl"><div class="text-xs text-slate-400">ระดับน้ำล่าสุด</div><div id="kpi-level" class="text-2xl font-semibold">–</div></div>
			<div class="dark-card p-4 rounded-xl"><div class="text-xs text-slate-400">ระยะเหลือถึงตลิ่ง</div><div id="kpi-remain" class="text-2xl font-semibold">–</div></div>
			<div class="dark-card p-4 rounded-xl"><div class="text-xs text-slate-400">เวลาข้อมูล</div><div id="kpi-time" class="text-lg font-semibold">–</div></div>
		</div>

		<div class="dark-card p-6 rounded-xl shadow-lg">
			<div id="update-status" class="text-xs text-slate-400 mb-2 text-right">กำลังโหลดข้อมูล...</div>
			<div id="waterChart" style="width:100%; height:480px;"></div>
		</div>
	</div>

	<script>
		const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzyjnUcahW-hHoz5VJ0th1IiTqO5sTrcnKeLM-ACVYwS0y4LZPe3AYUgNM1qe4NQQl_/exec';
		const POLL_MS = 60000;          // เช็คทุก 1 นาที (เซิร์ฟเวอร์ตอบจาก Cache จึงเบามาก)
		const STALE_MS = 30 * 60000;    // ข้อมูลเก่ากว่า 30 นาทีถือว่าค้าง
		const LS_KEY = 'bpk_snapshot';

		Highcharts.setOptions({ time: { timezoneOffset: -420 } }); // เวลาไทย UTC+7

		const el = id => document.getElementById(id);
		let chart = null, timer = null, loading = false;

		// สร้างกราฟทันที (ไม่รอข้อมูล) เพื่อไม่ให้หน้าจอว่าง
		function initChart() {
			chart = Highcharts.chart('waterChart', {
				chart: { backgroundColor: '#111c38', style: { fontFamily: 'Prompt' }, zoomType: 'x' },
				title: { text: null }, credits: { enabled: false }, legend: { enabled: false },
				xAxis: { type: 'datetime', gridLineColor: '#1e293b', gridLineWidth: 1, labels: { style: { color: '#94a3b8' } } },
				yAxis: { title: { text: 'ระดับน้ำ (ม.รทก.)', style: { color: '#94a3b8' } }, gridLineColor: '#1e293b',
					labels: { style: { color: '#94a3b8' } }, plotLines: [] },
				tooltip: { backgroundColor: '#0b1329', style: { color: '#e2e8f0' }, borderColor: '#1e293b',
					valueSuffix: ' ม.รทก.', valueDecimals: 3, xDateFormat: '%d/%m/%Y %H:%M' },
				series: [{ name: 'ระดับน้ำ', type: 'area', color: '#38bdf8', turboThreshold: 0, marker: { enabled: false },
					fillColor: { linearGradient: { x1: 0, y1: 0, x2: 0, y2: 1 },
						stops: [[0, 'rgba(56,189,248,0.4)'], [1, 'rgba(56,189,248,0)']] }, data: [] }]
			});
		}

		function render(d) {
			const hist = (d.history || []).filter(p => p && isFinite(p[1]));
			chart.series[0].setData(hist, false);
			const ax = chart.yAxis[0];
			ax.removePlotLine('bank');
			ax.addPlotLine({ id: 'bank', value: d.bank_level, color: '#ef4444', dashStyle: 'Dash', width: 2,
				label: { text: 'ระดับตลิ่ง ' + d.bank_level + ' ม.รทก.', style: { color: '#ef4444', fontWeight: 'bold' }, align: 'right' } });
			chart.redraw();

			const lvl = d.water_level, remain = d.bank_level - lvl;
			el('kpi-level').textContent = lvl == null ? '–' : lvl.toFixed(3) + ' ม.รทก.';
			const r = el('kpi-remain');
			r.textContent = lvl == null ? '–' : remain.toFixed(2) + ' ม.';
			r.className = 'text-2xl font-semibold ' + (remain <= 0 ? 'text-red-500' : remain <= 0.3 ? 'text-amber-400' : 'text-emerald-400');
			el('kpi-time').textContent = d.updated_ts ? new Date(d.updated_ts).toLocaleString('th-TH', { timeZone: 'Asia/Bangkok' }) : '–';

			const stale = d.updated_ts && Date.now() - d.updated_ts > STALE_MS;
			el('update-status').textContent = (stale ? '⚠️ ข้อมูลล่าสุดค้างเกิน 30 นาที · ' : '') + 'อัปเดตจากระบบ: ' + d.updated_at;
		}

		async function load() {
			if (loading) return;
			loading = true;
			const ctl = new AbortController();
			const t = setTimeout(() => ctl.abort(), 20000); // timeout 20 วินาที
			try {
				const res = await fetch(SCRIPT_URL, { signal: ctl.signal, cache: 'no-store' });
				if (!res.ok) throw new Error('HTTP ' + res.status);
				const d = await res.json();
				if (d.error) throw new Error(d.error);
				render(d);
				try { localStorage.setItem(LS_KEY, JSON.stringify(d)); } catch (_) {}
			} catch (err) {
				console.error('Failed to load data:', err);
				el('update-status').textContent = '⚠️ โหลดข้อมูลไม่สำเร็จ (' + (err.name === 'AbortError' ? 'หมดเวลา' : err.message) + ') จะลองใหม่อัตโนมัติ';
			} finally { clearTimeout(t); loading = false; }
		}

		function start() { stop(); load(); timer = setInterval(load, POLL_MS); }
		function stop() { if (timer) clearInterval(timer); timer = null; }

		initChart();
		// แสดงข้อมูลที่เคยโหลดไว้ทันที แล้วค่อยอัปเดตของใหม่ทับ
		try { const c = JSON.parse(localStorage.getItem(LS_KEY)); if (c) render(c); } catch (_) {}
		el('refresh').addEventListener('click', load);
		document.addEventListener('visibilitychange', () => document.hidden ? stop() : start()); // หยุดโพลล์ตอนซ่อนแท็บ
		start();
	</script>
	</body>
</html>
